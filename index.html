<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Operations X-Ray</title>
  <style>
    :root {
      --bg-color: #f5f5f0;
      --card-bg: #ffffff;
      --text-main: #1a1a1a;
      --text-muted: #555555;
      --accent-green: #1e3a2b;
      --accent-green-hover: #14281e;
      --accent-light-green: #eef3f0;
      --border-color: #e2e2dc;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      line-height: 1.5;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
      padding: 60px 20px;
    }

    /* --- LANDING PAGE STYLES --- */
    #landing-view {
      text-align: center;
    }

    h1.hero-title {
      font-family: Georgia, serif;
      font-size: 52px;
      font-weight: 400;
      letter-spacing: -0.02em;
      margin-bottom: 16px;
    }

    h1.hero-title i {
      font-style: italic;
    }

    .subtitle {
      font-size: 18px;
      color: var(--text-muted);
      max-width: 620px;
      margin: 0 auto 40px auto;
    }

    /* 3 Feature Cards Row */
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      margin-bottom: 30px;
      text-align: left;
    }

    .card-feature {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
    }

    .card-feature .number {
      font-size: 12px;
      color: #888;
      font-family: monospace;
      margin-bottom: 12px;
    }

    .card-feature h3 {
      font-size: 18px;
      margin: 0 0 8px 0;
      font-weight: 600;
    }

    .card-feature p {
      font-size: 14px;
      color: var(--text-muted);
      margin: 0;
    }

    /* "What makes this different" Box */
    .card-differentiator {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 28px;
      text-align: left;
      margin-bottom: 40px;
    }

    .diff-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: #888;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .diff-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .diff-list li {
      font-size: 15px;
      color: #333;
      margin-bottom: 12px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .diff-list li:last-child { margin-bottom: 0; }

    /* CTA Buttons */
    .cta-btn {
      display: inline-block;
      background-color: var(--accent-green);
      color: #ffffff;
      font-size: 18px;
      font-weight: 600;
      padding: 16px 40px;
      border-radius: 40px;
      border: none;
      cursor: pointer;
      transition: background-color 0.2s ease;
      text-decoration: none;
    }

    .cta-btn:hover {
      background-color: var(--accent-green-hover);
    }

    .trust-bullets {
      font-size: 12px;
      letter-spacing: 0.08em;
      color: #888;
      text-transform: uppercase;
      margin-top: 16px;
    }

    /* --- FORM / SCANNER VIEW STYLES --- */
    #scanner-view {
      display: none;
    }

    .form-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 36px;
      max-width: 580px;
      margin: 0 auto;
    }

    .step-indicator {
      font-size: 12px;
      color: #888;
      font-weight: 600;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
    }

    .step-content { display: none; }
    .step-content.active { display: block; }

    .step-content h2 {
      font-size: 32px;
      font-family: Georgia, serif;
      font-weight: 400;
      margin: 0 0 8px 0;
    }

    label {
      display: block;
      font-weight: 600;
      margin-top: 20px;
      margin-bottom: 6px;
      font-size: 14px;
    }

    .sublabel {
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      margin-left: 6px;
    }

    input, textarea {
      width: 100%;
      padding: 14px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 15px;
      background: #fafafa;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: var(--accent-green);
      background: #fff;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-option {
      flex: 1;
      min-width: 80px;
      padding: 12px;
      border: 1px solid var(--border-color);
      background: #fff;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      font-size: 14px;
    }

    .btn-option.selected {
      border-color: var(--accent-green);
      background: var(--accent-light-green);
      font-weight: bold;
    }

    button.primary-btn {
      margin-top: 28px;
      width: 100%;
      background: var(--accent-green);
      color: #fff;
      padding: 16px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    button.primary-btn:hover {
      background: var(--accent-green-hover);
    }
  </style>
</head>
<body>

<div class="container">

  <!-- ================= LANDING PAGE VIEW ================= -->
